[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logsift"
version = "0.1.0"
description = "Filter, summarise and find spikes in log files"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.1"]

[project.scripts]
logsift = "logsift.cli:main"

[tool.setuptools.packages.find]
include = ["logsift*"]

[tool.ruff]
line-length = 100

# Rules are selected explicitly rather than relying on ruff's defaults, which
# change between releases -- otherwise a ruff upgrade turns CI red on code
# that nobody touched.
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
